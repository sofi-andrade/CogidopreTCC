<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comuna Esportes</title>
  <link rel="stylesheet" href="css/style copy.css">
</head>

<body>

  <!-- HEADER / NAVBAR -->
  <header>
    <div class="logo">
      <a href="comuna-esportes.html">
        <img src="img/logo-comuna-esportes.png" alt="Logo Comuna Esportes" class="logo-img">
      </a>
    </div>
    <nav class="main-nav">
      <a href="comuna-esportes.html">Início</a>
      <a href="locais.html">Locais</a>
      <a href="#">Notícias</a>
    </nav>
    <div class="nav-right">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <div class="avatar">SR</div>
      <button class="menu-toggle" aria-label="Abrir menu">☰</button>
    </div>
  </header>

  <!-- BUSCA E FILTROS -->
  <section class="pesquisa-container">
    <form class="barra-pesquisa" role="search">
      <span class="icone-pesquisa" aria-hidden="true"></span>
      <input
        type="search"
        name="local"
        placeholder="Pesquise o local mais próximo de você"
        aria-label="Pesquisar local">
    </form>

    <nav class="filtros" aria-label="Categorias de esporte">
      <button class="filtro ativo" type="button">Todos</button>
      <button class="filtro" type="button">Futebol</button>
      <button class="filtro" type="button">Vôlei</button>
      <button class="filtro" type="button">Basquete</button>
      <button class="filtro" type="button">Dança</button>
      <button class="filtro" type="button" aria-label="Mapa">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 512 512">
          <path fill="currentColor" d="M512 48c0-8.3-4.3-16-11.3-20.4s-15.9-4.8-23.3-1.1L352.5 88.1 180 29.4c-13.7-4.7-28.7-3.8-41.9 2.3L13.8 90.3C5.4 94.2 0 102.7 0 112L0 464c0 8.2 4.2 15.9 11.1 20.3s15.6 4.9 23.1 1.4l127.3-59.9 170.7 56.9c13.7 4.6 28.5 3.7 41.6-2.5l124.4-58.5c8.4-4 13.8-12.4 13.8-21.7l0-352zM144 82.1l0 299-96 45.2 0-299 96-45.2zm48 303.3l0-301.1 128 43.5 0 300.3-128-42.7zM368 134l96-47.4 0 298.2-96 45.2 0-296z"/>
        </svg>
      </button>
    </nav>
  </section>

  <!-- CONTAINER ONDE OS CARDS SERÃO RENDERIZADOS VIA SCRIPT -->
  <main class="destaque" id="listaCards"></main>

  <!-- RODAPÉ -->
  <footer>
    <div>
      <h4>Entre em contato</h4>
      <p>comunaesportes@gmail.com</p>
    </div>
    <div class="social">
      <a href="#" aria-label="Instagram">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="0.8" fill="#fff" />
        </svg>
      </a>
      <a href="#" aria-label="E-mail">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 7l9 6 9-6" />
        </svg>
      </a>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>

</html>
